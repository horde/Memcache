---
id: Memcache
name: Memcache
full: Memcache client library
description: >-
  PSR-16 Simple Cache implementation for memcache with Horde-specific
  extensions. Supports large items (>1MB), multi-key retrieval, and both
  Memcache/Memcached PHP extensions.
list: dev
type: library
homepage: https://www.horde.org/libraries/Horde_Memcache
authors:
  -
    name: Michael Slusarz
    user: slusarz
    email: slusarz@horde.org
    active: false
    role: lead
version:
  release: 3.0.0-beta2
  api: 1.1.0
state:
  release: beta
  api: stable
license:
  identifier: LGPL-2.1
  uri: http://www.horde.org/licenses/lgpl21
dependencies:
  required:
    php: ^8.2
    composer:
      horde/exception: ^3
      psr/simple-cache: ^3.0
      psr/log: ^3.0
    ext:
      hash: '*'
  optional:
    ext:
      memcache: ^2
      memcached: '*'
  dev:
    composer:
      horde/test: ^3
      horde/log: ^3
provide:
  psr/simple-cache-implementation: 1.0
keywords:
  - in-memory
  - psr-16
vendor: horde
quality:
  phpstan:
    level: 3
